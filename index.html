<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project Hope — Intro</title>
<style>
  @font-face {
    font-family: 'Aerospace';
    src: url('./aerospace.regular.otf') format('opentype');
    font-display: block;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background:#06051a;
    font-family:'Aerospace', sans-serif;
  }
  #scene {
    position:fixed; inset:0;
    width:100%; height:100%;
    display:block;
  }
  #vignette {
    position:fixed; inset:0;
    pointer-events:none;
    background: radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(3,2,12,0.7) 100%);
    z-index:2;
  }
  #sub {
    position:fixed;
    left:0; right:0;
    top:50%;
    height:1.4em;
    transform: translateY(-50%);
    display:grid;
    justify-items:center;
    align-items:center;
    pointer-events:none;
    opacity:0;
    z-index:3;
  }
  #sub .phrase {
    grid-area: 1 / 1;
    font-size: clamp(9px, 0.95vw, 13px);
    letter-spacing: 0.14em;
    padding-left: 0.14em;
    text-transform: uppercase;
    color: #A0B2FF;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 1.1s ease;
    text-shadow: 0 0 14px rgba(91,102,255,0.6);
  }
  #sub .phrase.show { opacity: 1; }
  #replay {
    position:fixed;
    bottom:28px; right:28px;
    z-index:5;
    padding:10px 18px;
    font-family:'Aerospace', sans-serif;
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:#A0B2FF;
    background: rgba(25,30,90,0.35);
    border: 1px solid rgba(123,136,255,0.4);
    border-radius: 999px;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition: all .25s ease;
  }
  #replay.show { opacity:0.9; pointer-events:auto; }
  #replay:hover {
    background: rgba(91,102,255,0.25);
    border-color:#7988FF;
    color:#fff;
    box-shadow: 0 0 22px rgba(91,102,255,0.45);
  }
  #sound {
    position:fixed;
    top:28px; left:28px;
    z-index:5;
    display:flex;
    align-items:center;
    gap:12px;
  }
  #sound-btn {
    width:36px; height:36px;
    display:grid;
    place-items:center;
    padding:0;
    color:#A0B2FF;
    background: rgba(25,30,90,0.35);
    border: 1px solid rgba(123,136,255,0.4);
    border-radius: 999px;
    cursor:pointer;
    opacity:0.9;
    transition: all .25s ease;
  }
  #sound-btn:hover {
    background: rgba(91,102,255,0.25);
    border-color:#7988FF;
    color:#fff;
    box-shadow: 0 0 22px rgba(91,102,255,0.45);
  }
  #sound-panel {
    display:none;
    align-items:center;
    gap:6px;
    padding:4px 10px;
    background: rgba(25,30,90,0.35);
    border: 1px solid rgba(123,136,255,0.4);
    border-radius: 999px;
    font-size:10px;
    letter-spacing:0.12em;
    color:#A0B2FF;
  }
  #sound-panel.open { display:flex; }
  #volume { width:64px; height:12px; accent-color:#7988FF; cursor:pointer; }
  #volume-value { min-width:2.6em; text-align:right; }
  #loading {
    position:fixed; inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#06051a;
    color:#A0B2FF;
    letter-spacing:0.3em;
    font-size:13px;
    text-transform:uppercase;
    transition: opacity .6s ease;
  }
  #loading.hide { opacity:0; pointer-events:none; }
</style>
</head>
<style>body.sala #vignette, body.sala #sub, body.sala #sound, body.sala #replay, body.sala #loading { display: none !important; }</style>
<body>

  <canvas id="scene"></canvas>
  <div id="vignette"></div>
  <div id="sub"></div>
  <div id="sound">
    <button id="sound-btn" type="button" aria-label="Sonido" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
        <path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <div id="sound-panel">
      <input id="volume" type="range" min="0" max="100" step="1" aria-label="Volumen de la música" />
      <span id="volume-value"></span>
    </div>
  </div>
  <button id="replay" type="button">Repetir animación</button>  <div id="loading"><span id="loading-text">Cargando</span></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./app.js?v=4"></script>
</body>
</html>
